name: Max Review

# Thin caller. The gate itself lives once, in the plugin repo:
#   edusta-apps/ed-claude-plugin/.github/workflows/max-review-reusable.yml
#
# Edit it there and every repo picks the change up on its next pull request.
# This file previously held the whole gate, duplicated across six repos, so
# any change to it was six pull requests.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One Max per PR. A new push cancels the review of the superseded head so a
# rapid-fire branch does not fan out into parallel subscription spend.
concurrency:
  group: max-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  Max:
    # This repo is public, so a pull request from a fork receives no
    # secrets. Skip Max on fork PRs; a maintainer reviews those by hand.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: edusta-apps/ed-claude-plugin/.github/workflows/max-review-reusable.yml@main
    secrets: inherit
